  name: Playwright Registration Tests

  on:
    # Run tests after every push to any branch
    push:

    # Run tests for pull requests targeting main
    pull_request:
      branches:
        - master

    # Allow manual execution from GitHub Actions
    workflow_dispatch:

  jobs:
    test:
      runs-on: windows-latest
      timeout-minutes: 20

      env:
        BASE_URL: https://am.globbing.com
        CI: true

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 22
            cache: npm

        - name: Install dependencies
          run: npm ci

        - name: Install Playwright browsers
          run: npx playwright install

        - name: Run Playwright registration tests
          run: npx playwright test tests/registration.spec.ts

        - name: Upload Playwright HTML report
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: playwright-html-report
            path: playwright-report/
            retention-days: 14

        - name: Generate Allure report
          if: always()
          run: npx allure generate ./allure-results --clean -o ./allure-report

        - name: Upload Allure HTML report
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: allure-html-report
            path: allure-report/
            retention-days: 14